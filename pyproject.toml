[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-gpu-scheduler-lab"
version = "0.1.0"
description = "A reproducible comparison of Kubernetes GPU schedulers on the same workload traces, on simulated nodes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["kubernetes", "gpu", "scheduling", "kwok", "kueue", "volcano", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Distributed Computing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
cluster = ["kubernetes>=29.0.0"]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
k8slab = "k8slab.cli:main"

[project.urls]
Homepage = "https://github.com/Zhanyl-tech/k8s-gpu-scheduler-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/k8slab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
# The cluster path is optional: `pip install -e ".[dev]"` (what CI does) omits
# it deliberately, so the client is not importable there.
module = ["kubernetes.*"]
ignore_missing_imports = true
