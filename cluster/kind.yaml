# A single-node kind cluster. It hosts the control plane only.
#
# Every "GPU node" in this lab is a kwok node: an API object with no kubelet
# behind it. The control plane is real, the scheduling decisions are real, the
# hardware is not. See docs/limitations.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8slab
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            # 1200 fake nodes and a few thousand pods is well inside these
            # limits; raised so the API server is never the bottleneck being
            # measured instead of the scheduler.
            max-requests-inflight: "800"
            max-mutating-requests-inflight: "400"
        controllerManager:
          extraArgs:
            kube-api-qps: "200"
            kube-api-burst: "400"
        scheduler:
          extraArgs:
            kube-api-qps: "200"
            kube-api-burst: "400"
