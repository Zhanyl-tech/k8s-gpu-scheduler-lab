name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      # No cluster in CI. These exercise the fleet loader, the trace schema, the
      # policies and the metrics — everything except the runner, which needs a
      # control plane. `make bench` is the integration test and runs locally.
      - run: pytest -q
