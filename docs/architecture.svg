<!-- ============ BOTTOM BAND: lifetime control + baselines ============ -->
<rect x="52" y="572" width="1096" height="106" rx="5" fill="#1a212c" stroke="#2b3444" stroke-width="1.5"/>
<rect x="52" y="572" width="4" height="106" rx="2" fill="#f5b544"/>
<line x1="684" y1="592" x2="684" y2="658" stroke="#2b3444" stroke-width="1.2"/>

<text x="76" y="598" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" letter-spacing="1.3" font-weight="700" fill="#f5b544">THE RUNNER OWNS JOB LIFETIME</text>
<text x="76" y="622" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#adb8c4">A pod holds its GPUs for exactly the duration the trace assigned,</text>
<text x="76" y="641" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#adb8c4">then the runner deletes it. kwok&#8217;s own retire stages are removed at</text>
<text x="76" y="660" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" fill="#adb8c4">setup: leaving them in frees GPUs early and inflates utilization.</text>

<text x="712" y="598" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" letter-spacing="1.3" font-weight="700" fill="#828c98">DEGENERATE BASELINES</text>
<text x="712" y="622" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#828c98">D-fifo &#183; D-random &#183; D-largest &#183; D-preempt</text>
<text x="712" y="641" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12.5" fill="#7d8894">In every results table. A configuration that does</text>
<text x="712" y="660" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12.5" fill="#7d8894">not beat D-random has not been shown to schedule.</text>

