<text x="44" y="66" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#828c98">The control plane, the scheduler and every binding decision are real. The GPUs are not.</text>

