<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">k8s-gpu-scheduler-lab: what is real and what is simulated</title>
<desc id="dsc">A left-to-right pipeline. A seeded workload trace and a heterogeneous fleet definition feed a kind cluster. Inside the cluster, the control plane, the scheduler under test, and every binding decision are real; the GPU nodes are kwok objects with no kubelet and no hardware. Pod bindings and sampled free-GPU counts are recorded as an observation, which is scored into makespan, wait times, three fragmentation definitions (definition C at the node level is the headline), stranded gang GPU-hours and fairness. The runner, not kwok, deletes each pod when its trace duration elapses.</desc>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
  </marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8894"/>
  </marker>
</defs>

<rect width="1200" height="700" fill="#141a23"/>

