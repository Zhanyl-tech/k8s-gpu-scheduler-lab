# The default fleet: deliberately heterogeneous.
#
# Heterogeneous so that request shapes and node shapes mismatch: a 4-GPU pod
# fits an 8-GPU node but not a 2-GPU one, so where a scheduler puts small jobs
# decides what the large ones can still use. (This comment used to say a fleet
# of identical nodes cannot fragment and would read ~0 for every scheduler.
# Under the default mixed trace it does not: the homogeneous control reads
# 16-25% under C-node in the reference model, differing by policy --
# docs/metrics.md, "The control".)
#
# 26 nodes / 140 GPUs (12x8 + 8x4 + 6x2) — small enough that kwok and the API server stay
# comfortable on a laptop, large enough that packing decisions diverge.
#
# Topology is a DECLARED SCENARIO, not hardware: kwok nodes have no fabric and
# the lab sends no NCCL traffic. It exists so placement can be measured (which
# domain a job's pods span) and so Definition C fragmentation has rack and
# switch levels. Derivation rule (k8slab.topology.derive): each class fills its
# own racks nodesPerRack at a time, racks are numbered across the fleet in file
# order, and consecutive racks are grouped racksPerSwitch at a time. Here:
#   dgx8  -> rack-0..rack-2 (4 nodes each)   NVLink
#   mid4  -> rack-3..rack-4 (4 nodes each)   PCIe only
#   edge2 -> rack-5         (6 nodes)        PCIe only
#   switch-0 = rack-0,1   switch-1 = rack-2,3   switch-2 = rack-4,5
# Every level has more than one domain on purpose: a level with a single
# domain can only report "was anything allocated anywhere".
name: default
topology:
  racksPerSwitch: 2
nodeClasses:
  - name: dgx8
    count: 12
    gpus: 8
    cpus: 96
    memoryGi: 1024
    nvlink: true
    nodesPerRack: 4
  - name: mid4
    count: 8
    gpus: 4
    cpus: 48
    memoryGi: 512
    nvlink: false
    nodesPerRack: 4
  - name: edge2
    count: 6
    gpus: 2
    cpus: 24
    memoryGi: 128
    nvlink: false
    nodesPerRack: 6
